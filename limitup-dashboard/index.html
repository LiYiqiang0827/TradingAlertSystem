<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111a20"><title>涨停研究台 · TradingAlert</title>
    <link rel="stylesheet" href="/styles.css?v=20261027-ladder-v415-pin-hover">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">T</div><div><strong>TradingAlert</strong><span>涨停研究台</span></div><button class="collapse" aria-label="隐藏导航栏" title="隐藏导航栏" aria-expanded="true" aria-controls="topicNav">‹</button></div>
    <div class="live-controls">
      <time id="marketClock" class="market-clock" title="北京时间"><span></span><strong></strong></time>
      <span id="marketStatus" class="market-session" aria-live="polite">读取交易状态…</span>
      <button id="liveDataToggle" class="live-data-toggle" type="button" role="switch" aria-checked="false" aria-label="启用实时数据" disabled><span class="live-switch-track" aria-hidden="true"><i></i></span><span>实时数据</span></button>
    </div>
    <div id="liveNav" class="live-nav" hidden>
      <button id="liveMonitorLink" class="topic-button overview-nav-button" type="button"><span class="overview-nav-icon">实</span><span class="topic-label">实时监控</span></button>
    </div>
    <nav id="topicNav" class="topic-nav" aria-label="主导航"></nav>
    <div class="side-bottom"><span class="status-dot"></span><span id="dataSourceLabel">正在连接数据</span><button id="databaseButton" type="button" title="数据库状态" aria-haspopup="dialog">库</button></div>
  </aside>
  <button id="navReopen" class="nav-reopen" type="button" aria-label="显示导航栏" title="显示导航栏">›</button>
  <main class="main-area">
    <header class="topbar"><div class="crumb"><span id="crumbWorkspace" hidden></span><button id="crumbBack" class="crumb-back" type="button" hidden></button><b id="crumbSeparator" hidden>/</b><strong id="crumbCurrent">每日总览</strong></div><div id="topbarActions" class="top-actions"></div></header>
    <section id="content" class="content"><div class="loading"><span class="spinner"></span><p>正在读取每日分析与市场数据…</p></div></section>
  </main>
</div>
<div id="datePicker" class="date-picker" role="dialog" aria-label="选择有数据的交易日" hidden></div>
<div id="selectionAction" class="selection-action" hidden><button id="analyzeSelection">✦ 分析这段</button></div>
<aside id="analysisDrawer" class="analysis-drawer" aria-hidden="true"><div class="drawer-header"><div><span class="eyebrow">研究助手</span><h2>解构这段内容</h2></div><button id="closeDrawer" class="icon-button">×</button></div><blockquote id="selectedText" class="selected-text"></blockquote><label class="field-label" for="analysisQuestion">你还想追问什么？</label><textarea id="analysisQuestion" placeholder="例如：这条逻辑和封板时间吻合吗？公司实际受益在哪一环？"></textarea><button id="runAnalysis" class="primary-button">生成结构化分析 <span>→</span></button><div id="analysisResult" class="analysis-result"><div class="empty-insight"><span>✦</span><p>选中文本后点击“分析这段”，我会结合当日题材、封板时间和个股业务桥梁整理脉络。</p></div></div><div class="drawer-foot">基于本地数据库与复盘文档 · 结论会区分事实和推断</div></aside>
<div id="settingsOverlay" class="settings-overlay" hidden><section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><header><div><span class="eyebrow">PREFERENCES</span><h2 id="settingsTitle">设置</h2></div><button id="closeSettings" class="icon-button" aria-label="关闭设置">×</button></header><div class="settings-group"><strong>界面显示大小</strong><div class="settings-options" id="uiScaleOptions"><button type="button" data-scale="auto">自动</button><button type="button" data-scale="1">标准</button><button type="button" data-scale="1.1">放大</button><button type="button" data-scale="1.2">更大</button></div><p>自动模式会根据窗口宽度调整显示。</p></div><div class="settings-group"><strong>个股与指数页面图表布局</strong><div class="settings-options" id="chartLayoutOptions"><button type="button" data-layout="standard">单列</button><button type="button" data-layout="grid">六宫格</button></div></div><div class="settings-group"><strong>个股与指数图表日期</strong><div class="settings-options" id="stockDateModeOptions"><button type="button" data-mode="analysis">不看未来</button><button type="button" data-mode="latest">最新日期</button></div><p>“不看未来”显示所选复盘日数据；“最新日期”显示当前数据集中最新交易日。</p></div></section></div>
<div id="chartZoomOverlay" class="chart-zoom-overlay" hidden><section class="chart-zoom-dialog" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="chartZoomTitle"><header><strong id="chartZoomTitle"></strong><div id="chartZoomControls" class="chart-zoom-controls" hidden></div><span id="chartZoomHint">双击图表或按 Esc 关闭</span><button id="closeChartZoom" type="button" aria-label="关闭放大图表">×</button></header><div id="chartZoomContent" class="chart-zoom-content"></div></section></div>
<div id="toast" class="toast"></div>
<script src="/vendor/klinecharts-10.1.0.min.js?v=css-coordinate-v1"></script><script src="/watchlists.js?v=20261027-watchlist-v3-monitor"></script><script src="/live_stocks.js?v=20261027-monitor-v8-three-cache"></script><script src="/database_panel.js?v=20261027-db-panel-v3-descriptions"></script><script src="/app.js?v=20261027-ladder-v415-pin-hover"></script>
</body></html>
